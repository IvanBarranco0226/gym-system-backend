name: Gym System Backend CI

# 1. ¿Cuándo se activa el robot?
on:
  push:
    branches: [ "main", "master" ] # Cada vez que subas código a la rama principal
  pull_request:
    branches: [ "main", "master" ]

# 2. ¿Qué trabajo va a realizar?
jobs:
  build:
    runs-on: ubuntu-latest # Le pedimos a GitHub que nos preste un servidor Linux vacío

    steps:
    # A. Clonar tu código en ese servidor prestado
    - name: Check out the code
      uses: actions/checkout@v3

    # B. Instalar Java 17 en el servidor
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # C. Darle permisos al archivo Maven para que se pueda ejecutar
    - name: Make Maven wrapper executable
      run: chmod +x ./mvnw

    # D. ¡El momento de la verdad! Compilar el código y correr pruebas
    - name: Build with Maven
      run: ./mvnw clean package